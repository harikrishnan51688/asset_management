services:

  neo4j:
    image: neo4j:5.26.0-community
    container_name: wazuh_neo4j
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password123} 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: .
    container_name: wazuh_asset_app
    ports:
      - "8080:8080" # Web Visualizer & REST API
    env_file:
      - .env
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - WAZUH_HOST=${WAZUH_HOST:-https://192.168.1.38:55000}
      - WAZUH_USER=${WAZUH_USER:-wazuh-wui}
      - WAZUH_PASSWORD=${WAZUH_PASSWORD:-MyS3cr37P450r.*-}
      - VERIFY_SSL=${VERIFY_SSL:-false}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${SERVER_PORT:-8080}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./web:/app/web
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  neo4j_data:
  neo4j_logs:

